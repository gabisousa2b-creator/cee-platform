<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EchoWAI — Pipeline dossiers</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<meta name="theme-color" content="#2E7EF4" />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/css/echowai.css">
<style>
  body { font-family: 'Bricolage Grotesque', 'Public Sans', system-ui, sans-serif; background: #f1f5f9; color: var(--ink, #0a1f3d); margin: 0; }
  .topbar { background: #fff; border-bottom: 1px solid rgba(10,31,61,.08); padding: 14px 28px; display:grid; grid-template-columns: 1fr auto 1fr; align-items:center; }
  .topbar .ew-logo { grid-column: 2; justify-self: center; font-size: 1.35rem; }
  .topbar .right { grid-column: 3; justify-self: end; display:flex; gap:14px; align-items:center; }
  .container { padding: 24px 28px; }
  h1 { font-size: 28px; letter-spacing: -.02em; font-weight: 500; margin: 0 0 6px; }
  .sub { color: #475569; font-size: 13.5px; margin: 0 0 22px; }
  .kanban {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px; align-items: start;
  }
  .col {
    background: #f8fafc; border: 1px solid rgba(10,31,61,.06);
    border-radius: 12px; padding: 12px; min-height: 200px;
    transition: background .2s ease;
  }
  .col.drag-over { background: rgba(46,126,244,.08); }
  .col-head { display:flex; align-items: center; justify-content: space-between; padding: 4px 6px 10px; }
  .col-title { font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #475569; font-weight: 600; }
  .col-count { font-size: 11px; color: #94a3b8; font-family: 'IBM Plex Mono', monospace; }
  .card {
    background: #fff; border: 1px solid rgba(10,31,61,.06); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 8px; cursor: grab;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card:hover { transform: translateY(-1px); box-shadow: 0 8px 22px -10px rgba(10,31,61,.20); }
  .card:active { cursor: grabbing; }
  .card .ref { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #94a3b8; }
  .card .name { font-size: 13.5px; font-weight: 600; margin-top: 3px; line-height: 1.3; }
  .card .meta { display:flex; justify-content: space-between; margin-top: 6px; font-size: 11.5px; color: #475569; }
  .card .meta .num { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; color: var(--accent, #2E7EF4); font-weight: 600; }
  .empty { color: #94a3b8; font-size: 12px; text-align: center; padding: 14px 0; font-style: italic; }
  .btn-back { background:#fff; border:1px solid rgba(10,31,61,.16); border-radius:8px; padding:7px 12px; font-size:12px; cursor:pointer; color: #475569; text-decoration: none; }
</style>
</head>
<body>
<div class="topbar">
  <div></div>
  <span class="ew-logo">echo<b>wai</b><i></i></span>
  <div class="right">
    <span class="ew-notif-host"></span>
    <a class="btn-back" href="/partenaire.html"><i class="fas fa-arrow-left me-1"></i>Espace mandataire</a>
  </div>
</div>

<div class="container">
  <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;color:#94a3b8;text-transform:uppercase">Pipeline</div>
  <h1>Vos dossiers en flux</h1>
  <p class="sub">Glissez les cartes entre les colonnes pour mettre à jour le statut. Données rafraîchies toutes les 60 s.</p>
  <div class="kanban" id="kanban"></div>
</div>

<script src="/js/ew-emmy.js" defer></script>
<script src="/js/ew-notif.js" defer></script>
<script>
const COLS = [
  { key: 'en_attente',  label: 'Prospect / En attente',        color: '#fef3c7' },
  { key: 'en_cours',    label: 'Engagé / En cours',            color: '#dbeafe' },
  { key: 'valide',      label: 'Validé',                       color: '#dcfce7' },
  { key: 'facture',     label: 'Versé / Facturé',              color: '#e0e7ff' },
  { key: 'refuse',      label: 'Refusé',                       color: '#fee2e2' },
];
const $ = s => document.querySelector(s);
const fmt = n => (n || 0).toLocaleString('fr-FR');
function esc(s) { return String(s == null ? '' : s).replace(/[&<>]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[m])); }

async function load() {
  const r = await fetch('/api/partner/kanban');
  if (!r.ok) { $('#kanban').innerHTML = '<div class="empty">Connexion requise — <a href="/mandataire">se connecter</a></div>'; return; }
  const rows = await r.json();
  const grouped = {};
  COLS.forEach(c => { grouped[c.key] = []; });
  rows.forEach(d => { (grouped[d.statut] || (grouped.en_cours)).push(d); });
  $('#kanban').innerHTML = COLS.map(c => `
    <div class="col" data-statut="${c.key}" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event)">
      <div class="col-head"><span class="col-title">${c.label}</span><span class="col-count">${grouped[c.key].length}</span></div>
      ${grouped[c.key].length ? grouped[c.key].map(d => `
        <div class="card" draggable="true" data-id="${d.id}" ondragstart="dragStart(event)">
          <div class="ref">${esc(d.code)}</div>
          <div class="name">${esc(d.raison_sociale || ((d.nom || '') + ' ' + (d.prenom || '')).trim() || '—')}</div>
          <div class="meta">
            <span>${esc(d.ville || '—')}</span>
            <span class="num">${fmt(d.prime || 0)} €</span>
          </div>
        </div>`).join('') : '<div class="empty">Aucun dossier</div>'}
    </div>`).join('');
}

let draggedId = null;
window.dragStart = (e) => { draggedId = e.target.dataset.id; e.dataTransfer.effectAllowed = 'move'; };
window.dragOver  = (e) => { e.preventDefault(); e.currentTarget.classList.add('drag-over'); };
window.dragLeave = (e) => { e.currentTarget.classList.remove('drag-over'); };
window.drop = async (e) => {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const newStatut = e.currentTarget.dataset.statut;
  if (!draggedId) return;
  await fetch('/api/partner/dossiers/' + draggedId + '/statut', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ statut: newStatut }),
  }).catch(() => {});
  draggedId = null;
  load();
};

load();
setInterval(load, 60 * 1000);
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});</script>
</body>
</html>
