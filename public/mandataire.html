<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EchoWAI — Espace mandataire</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<meta name="theme-color" content="#2E7EF4" />
  <meta name="robots" content="noindex">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/echowai.css">
  <style>
    body { background:var(--bg-0); min-height:100vh; display:flex; align-items:center; overflow-x:hidden; }
    .orb { position:fixed; border-radius:50%; filter:blur(90px); opacity:.5; z-index:0; pointer-events:none; }
    .orb-1 { width:520px; height:520px; top:-200px; right:-140px; background:radial-gradient(circle,var(--accent-glow),transparent 70%); }
    .orb-2 { width:460px; height:460px; bottom:-180px; left:-160px; background:radial-gradient(circle,rgba(91,140,255,.2),transparent 70%); }
    .login-wrap { position:relative; z-index:1; max-width:420px; margin:0 auto; padding:40px 22px; width:100%; }
    .logo-box { width:72px; height:72px; border-radius:var(--r-lg);
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      display:flex; align-items:center; justify-content:center; font-size:1.9rem; color:#fff;
      margin:0 auto 18px; box-shadow:0 0 46px -8px var(--accent-glow); }
    .login-wrap h1 { font-size:1.5rem; font-weight:700; letter-spacing:-.02em; color:var(--t1); text-align:center; margin-bottom:5px; }
    .login-wrap h1 span { color:var(--accent); }
    .login-sub { text-align:center; color:var(--t2); font-size:.9rem; margin-bottom:28px; }
    .login-card { background:var(--glass-fill);
      -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
      border:1px solid var(--border-light); border-radius:var(--r-xl); padding:30px 28px;
      box-shadow:var(--shadow-lg); position:relative; overflow:hidden; }
    .login-card::before { content:''; position:absolute; top:0; left:0; right:0; height:1px;
      background:linear-gradient(90deg,transparent,var(--accent-line),transparent); }
    .fld { margin-bottom:15px; }
    .fld label { display:block; font-size:.78rem; font-weight:600; color:var(--t2); margin-bottom:6px; }
    .fld input { width:100%; background:var(--bg-2); border:1px solid var(--border);
      border-radius:var(--r-sm); padding:11px 13px; color:var(--t1); font-size:.92rem; transition:border-color .14s; }
    .fld input:focus { outline:none; border-color:var(--border-focus); }
    .btn-login { width:100%; background:var(--accent); color:#fff; font-weight:700; font-size:.94rem;
      border:none; border-radius:var(--r-sm); padding:12px; margin-top:6px;
      display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
      transition:transform .14s, box-shadow .14s; }
    .btn-login:hover { transform:translateY(-2px); box-shadow:0 12px 30px -8px var(--accent-glow); }
    .btn-login:disabled { opacity:.6; cursor:default; transform:none; box-shadow:none; }
    .login-err { display:none; background:var(--danger-dim); border:1px solid rgba(255,107,107,.3);
      color:var(--danger); font-size:.82rem; border-radius:var(--r-sm); padding:9px 12px; margin-bottom:15px; }
    .login-foot { text-align:center; margin-top:22px; color:var(--t3); font-size:.79rem; }
    .login-foot a { color:var(--t3); text-decoration:none; }
    .login-foot a:hover { color:var(--accent); }
    .login-hint { text-align:center; margin-top:14px; color:var(--t3); font-size:.74rem; }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="login-wrap">
    <div style="text-align:center;margin-bottom:6px"><span class="ew-logo" style="font-size:1.85rem">echo<b>wai</b><i></i></span></div>
    <h1 style="text-align:center;font-size:1.45rem;font-weight:500;letter-spacing:-.02em;color:var(--t1);margin:14px 0 4px">Espace <span style="color:var(--accent)">mandataire</span></h1>
    <div class="login-sub">Apporteurs d'affaires &amp; mandataires CEE</div>
    <div class="login-card">
      <div class="login-err" id="loginErr"></div>
      <form id="loginForm">
        <div class="fld">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="username" placeholder="vous@organisation.fr">
        </div>
        <div class="fld">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required>
        </div>
        <button class="btn-login" type="submit" id="loginBtn"><i class="fas fa-right-to-bracket"></i>Se connecter</button>
      </form>
      <div class="login-hint">Apporteurs d'affaires, mandataires et administrateurs : accédez au dépôt et au suivi de vos dossiers CEE.</div>
    </div>
    <div class="login-foot">
      EchoWAI © 2026 · <a href="https://echowai.com">echowai.com</a> · <a href="https://echowai.com/beneficiaire">Espace bénéficiaire</a> · <a href="/oblige">Espace obligé</a> · <a href="/delegataire">Espace délégataire</a>
    </div>
  </div>

  <script src="/js/ew-emmy.js" defer></script>
  <script>
    // Déjà connecté → redirection directe
    (async () => {
      try {
        const p = await (await fetch('/api/partner/check-auth')).json();
        if (p && p.authenticated) { location.replace('/partenaire.html'); return; }
        const a = await (await fetch('/api/admin/check-auth')).json();
        if (a && a.authenticated) { location.replace('/admin.html'); return; }
      } catch(e) {}
    })();

    const form = document.getElementById('loginForm');
    const errEl = document.getElementById('loginErr');
    const btn = document.getElementById('loginBtn');
    form.addEventListener('submit', async e => {
      e.preventDefault();
      errEl.style.display = 'none';
      btn.disabled = true;
      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const d = await r.json().catch(() => ({}));
        if (r.ok && d.success && d.redirect) {
          location.href = d.redirect;
        } else {
          errEl.textContent = d.error || 'Identifiants incorrects';
          errEl.style.display = 'block';
          btn.disabled = false;
        }
      } catch(err) {
        errEl.textContent = 'Erreur de connexion. Réessayez.';
        errEl.style.display = 'block';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
